# MediPlate standard recipes v1
# ---------------------------------------------------------------------------
# Hand-built from standard Indian household recipes. Every ingredient is a raw
# weight in grams for ONE serving and points to an IFCT 2017 food code (A001…T014)
# or a MediPlate supplement code (SUP…) from supplements.csv.
# `salt` is added salt in grams per serving (kept separate so the planner can
# offer "less salt" versions). Nutrients are NOT typed here: the pipeline
# calculates them from IFCT 2017.
#
# zones:     home zones where the dish is a regular, everyday food
# common:    true  -> an all-India dish, used as the 3rd fallback tier
# universal: true  -> a basic (fruit, curd, salad, nuts) allowed in every tier
# slot:      breakfast | staple | protein | veg | side | snack | sweet
#            (sweet = searchable in Food check, never placed in plans)
# diet:      veg | egg | nonveg
#
# STATUS: estimates for a university prototype. A registered dietitian must
# review quantities before any patient use; replace with INDB recipes when
# available.
# ---------------------------------------------------------------------------

